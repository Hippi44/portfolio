<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HL">
  <!--
    Монограмма HL для вкладки браузера.
    Повторяет знак .brand-mark из шапки: плашка ember #ff5a1f, скругление 28%
    от стороны (в вёрстке это 9px при 32px), буквы тёмные #180a03.
    Буквы нарисованы прямоугольниками, а не текстом: шрифт во вкладке
    не подгружается, и text в фавиконке отрисовался бы чем придётся.
  -->
  <rect width="64" height="64" rx="18" fill="#ff5a1f"/>
  <g fill="#180a03">
    <rect x="12" y="17" width="7" height="30"/>
    <rect x="26" y="17" width="7" height="30"/>
    <rect x="12" y="28.5" width="21" height="7"/>
    <rect x="39" y="17" width="7" height="30"/>
    <rect x="39" y="40" width="13" height="7"/>
  </g>
</svg>
